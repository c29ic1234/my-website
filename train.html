<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<style>
		#train {
			display: flex;
			gap: 12px;
		}
		.cart {
			border: 1px solid black;
			min-width: 100px;
			height: 80px;
			text-align: center;
			position: relative;
		}

		.cart:before {
			content: "";
			width: 30px;
			height: 30px;
			border: 1px solid black;
			display: block;
			border-radius: 50%;
			position: absolute;
			bottom: -15px;
			background-color: white;
		}

		.cart:after {
			content: "";
			width: 30px;
			height: 30px;
			border: 1px solid black;
			display: block;
			border-radius: 50%;
			position: absolute;
			left: 68px;
			bottom: -15px;
			background-color: white;
		}
	</style>
</head>
<body>
	<button id="add-person">add person</button>
	<button id="remove-last-person">remove last person</button>
	<input type="text" id="person">
	<input type="color" id="colorPicker" name="" value="#ff0000">

	<div id="train"><meta charset="utf-8">
		<div class="cart">izzy</div>
		<div class="cart">alexandra</div>
		<div class="cart">victoria</div>

	<script>
		let people = ["izzy", "alexandra", "jiyaa", "victoria"]
		let izzy = {
			name: "izzy",
			fav_color: "blue"
		}
		let alexandra = {
			name: "alexandra",
			fav_color: "green",
		}

		let victoria = {
			name: "victoria",
			fav_color: "purple",
		}
		let peopleWithTrainColor = [izzy, alexandra, victoria]

		for(let i = 0; i < peopleWithTrainColor.length; i++){
			// console.log(people[i])

			let cart = document.createElement("div")
			cart.classList.add("cart")
			document.body.appendChild(cart)
			cart.textContent = peopleWithTrainColor[i].name
			cart.style.backgroundColor = peopleWithTrainColor[i].fav_color
			console.log(peopleWithTrainColor[i])
			train.appendChild(cart)

		}

		function makeTrain(){
			train.innerHTML = ""
			for(let i = 0; i < peopleWithTrainColor.length; i++){
			// console.log(people[i])
				let cart = document.createElement("div")
				cart.classList.add("cart")
				document.body.appendChild(cart)
				cart.textContent = peopleWithTrainColor[i].name
				cart.style.backgroundColor = peopleWithTrainColor[i].fav_color
				train.appendChild(cart)	
			}
		}

		makeTrain()
			
		let addPersonBtn = document.getElementById("add-person")
		addPersonBtn.addEventListener("click", function(){
			let personInput = document.getElementById("person")
			let colorPicker = document.getElementById("colorPicker")
			// console.log(personInput)
			// people.push(personInput.value)
			peopleWithTrainColor.push({
				name: personInput.value,
				fav_color: colorPicker.value
			})
			makeTrain()
		})
		
		let removeLastPersonBtn = document.getElementById("remove-last-person")
		removeLastPersonBtn.addEventListener("click", function (){
				people.pop()
				makeTrain()
				console.log(people)
			})

		
	</script>
</body>
</html>
