<script>
    const keys = document.querySelectorAll('.key');
    const allAudios = document.querySelectorAll('audio');

    keys.forEach(key => {
        key.addEventListener('click', () => {
            
            allAudios.forEach(audio => {
                audio.pause();
                audio.currentTime = 0
            });

            const targetAudioId = `${key.id}_audio`;
            const currentAudio = document.getElementById(targetAudioId);
            
            if (currentAudio) {
                currentAudio.play();
            }
        });
    });
</script>
